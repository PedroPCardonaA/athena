<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Ideas{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css"></head>
<body>
{% if csrf %}
<header><a href="/" class="brand">Ideas Saver</a><nav><a href="/tokens">API tokens</a>
<form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link">Log out</button></form></nav></header>
{% endif %}
<main>{% block body %}{% endblock %}</main>
</body></html>
