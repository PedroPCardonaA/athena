{% extends "bare.html" %}{% block title %}Welcome · Athena{% endblock %}{% block body %}
<h1>Welcome to Athena</h1><p>Choose a password for this instance. It is stored hashed on your machine only.</p>
<form method="post" action="/setup">
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<label class="field">Password (min {{ min }} characters) <input type="password" name="password" required minlength="{{ min }}" maxlength="256" autofocus autocomplete="new-password"></label>
<label class="field">Confirm <input type="password" name="confirm" required maxlength="256" autocomplete="new-password"></label>
<button>Set password</button></form>{% endblock %}
